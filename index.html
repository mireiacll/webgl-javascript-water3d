<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Columns</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="glCanvas"></canvas>

  <div id="panel">
    <h1>Simulation Controls</h1>
    <p id="stateLabel" class="state"></p>

    <div class="row buttons">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="deleteBtn">Delete</button>
    </div>

    <hr />

    <div class="field">
      <label for="dt">Time step dt (s) - live, works while running</label>
      <input type="range" id="dt" min="0.0001" max="0.1" step="0.0001" />
      <span id="dtValue" class="value"></span>
    </div>
    <p id="cflInfo" class="info"></p>

    <hr />
    <p class="section">Parameters (locked while running)</p>

    <div class="field">
      <label for="columnCount">Columns per side (grid is N x N)</label>
      <input type="range" id="columnCount" min="4" max="400" step="1" />
      <span id="columnCountValue" class="value"></span>
    </div>
    <p id="columnWidthInfo" class="info"></p>

    <div class="field">
      <label for="damping">Damping</label>
      <input type="range" id="damping" min="0.5" max="1.0" step="0.001" />
      <span id="dampingValue" class="value"></span>
    </div>

    <hr />
    <p class="section">Generate area</p>

    <div class="field">
      <label for="worldWidth">World width (m, square tank)</label>
      <input type="range" id="worldWidth" min="1" max="20000" step="1" />
      <span id="worldWidthValue" class="value"></span>
    </div>

    <div class="field">
      <label for="terrainHeightScale">Terrain height scale (m, procedural only)</label>
      <input type="range" id="terrainHeightScale" min="0" max="100" step="0.1" />
      <span id="terrainHeightScaleValue" class="value"></span>
    </div>

    <div class="field">
      <label for="centerLat">Center latitude (real terrain only)</label>
      <input type="number" id="centerLat" step="0.0001" min="-90" max="90" />
    </div>

    <div class="field">
      <label for="centerLon">Center longitude (real terrain only)</label>
      <input type="number" id="centerLon" step="0.0001" min="-180" max="180" />
    </div>

    <div class="row buttons">
      <button id="regenerateTerrainBtn">Random</button>
      <button id="loadRealTerrainBtn">Pull from real life</button>
    </div>

    <div class="field checkbox-field">
      <label for="showImagery">Show satellite imagery texture</label>
      <input type="checkbox" id="showImagery" checked />
    </div>
    <p class="info">Imagery: Esri World Imagery</p>

    <p id="realTerrainStatus" class="info"></p>

    <hr />
    <p class="section">Water source (locked while running)</p>

    <div class="field">
      <label for="simMode">Source</label>
      <select id="simMode">
        <option value="drop">Drop</option>
        <option value="rain">Rain</option>
      </select>
    </div>

    <div id="dropSection">
    <p class="section">Water drop</p>

    <div class="field">
      <label for="dropPositionX">Drop position X (m)</label>
      <input type="range" id="dropPositionX" min="0" max="2000" step="0.5" />
      <span id="dropPositionXValue" class="value"></span>
    </div>

    <div class="field">
      <label for="dropPositionY">Drop position Y (m)</label>
      <input type="range" id="dropPositionY" min="0" max="2000" step="0.5" />
      <span id="dropPositionYValue" class="value"></span>
    </div>

    <div class="field">
      <label for="dropWidth">Drop side (m, square block)</label>
      <input type="range" id="dropWidth" min="0.1" max="2000" step="0.1" />
      <span id="dropWidthValue" class="value"></span>
    </div>

    <div class="field">
      <label for="dropVolumeM3">Drop volume (m^3)</label>
      <input type="range" id="dropVolumeM3" min="0" max="1000" step="1" />
      <span id="dropVolumeM3Value" class="value"></span>
    </div>
    <p id="dropDepthInfo" class="info"></p>
    </div>

    <div id="rainSection" hidden>
      <p class="section">Rain</p>

      <div class="field">
        <label for="rainRate">Rain rate (mm/h) - live</label>
        <input type="range" id="rainRate" min="1" max="300" step="1" />
        <span id="rainRateValue" class="value"></span>
      </div>

      <div class="field">
        <label for="rainDuration">Stop rain after (min, 0 = manual)</label>
        <input type="number" id="rainDuration" min="0" step="1" />
      </div>

      <div class="row buttons">
        <button id="rainToggleBtn">Stop rain</button>
      </div>
      <p id="rainInfo" class="info" style="margin-top: var(--space-sm, 8px);"></p>
    </div>

    <hr />

    <div class="field checkbox-field">
      <label for="showOutline">Show column outlines</label>
      <input type="checkbox" id="showOutline" />
    </div>

    <div class="field checkbox-field">
      <label for="terrainAsMesh">Terrain as mesh (uncheck for columns)</label>
      <input type="checkbox" id="terrainAsMesh" checked />
    </div>

    <div class="field checkbox-field">
      <label for="waterAsMesh">Water as mesh (uncheck for columns)</label>
      <input type="checkbox" id="waterAsMesh" />
    </div>

    <hr />
    <p class="section">Water coloring (live, works while running)</p>

    <div class="field">
      <label for="waterColorMode">Color water by</label>
      <select id="waterColorMode">
        <option value="none">Nothing (plain water color)</option>
        <option value="depth">Water level (depth)</option>
        <option value="velocity">Velocity</option>
        <option value="flux">Flux</option>
      </select>
    </div>

    <div class="field checkbox-field">
      <label for="waterRangeAuto">Auto legend range</label>
      <input type="checkbox" id="waterRangeAuto" checked />
    </div>

    <div class="field">
      <label for="waterRangeMax">Legend max</label>
      <input type="number" id="waterRangeMax" step="any" min="0" />
    </div>

    <hr />
  </div>

  <div id="waterLegend" hidden style="position:fixed;left:12px;bottom:12px;min-width:200px;padding:8px 10px;background:rgba(10,10,20,0.75);color:#fff;font:12px sans-serif;border-radius:6px;pointer-events:none;">
    <div id="legendTitle" style="margin-bottom:4px;"></div>
    <div id="legendBar" style="height:12px;border-radius:2px;"></div>
    <div style="display:flex;justify-content:space-between;margin-top:2px;">
      <span id="legendMin">0</span><span id="legendMax"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
