<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Columns</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="glCanvas"></canvas>

  <div id="panel">
    <h1>Simulation Controls</h1>
    <p id="stateLabel" class="state"></p>

    <div class="row buttons">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="deleteBtn">Delete</button>
    </div>

    <hr />

    <div class="field">
      <label for="dt">Time step dt (s) - live, works while running</label>
      <input type="range" id="dt" min="0.0001" max="0.1" step="0.0001" />
      <span id="dtValue" class="value"></span>
    </div>
    <p id="cflInfo" class="info"></p>

    <hr />
    <p class="section">Parameters (locked while running)</p>

    <div class="field">
      <label for="columnCount">Column count</label>
      <input type="range" id="columnCount" min="4" max="2000" step="1" />
      <span id="columnCountValue" class="value"></span>
    </div>
    <p id="columnWidthInfo" class="info"></p>

    <div class="field">
      <label for="worldWidth">World width (m)</label>
      <input type="range" id="worldWidth" min="1" max="2000" step="1" />
      <span id="worldWidthValue" class="value"></span>
    </div>

    <div class="field">
      <label for="damping">Damping</label>
      <input type="range" id="damping" min="0.5" max="1.0" step="0.001" />
      <span id="dampingValue" class="value"></span>
    </div>

    <hr />
    <p class="section">Terrain</p>

    <div class="field">
      <label for="terrainHeightScale">Terrain height scale (m)</label>
      <input type="range" id="terrainHeightScale" min="0" max="100" step="0.1" />
      <span id="terrainHeightScaleValue" class="value"></span>
    </div>
    <button id="regenerateTerrainBtn">Regenerate Terrain</button>

    <hr />
    <p class="section">Water drop (shown live below as a preview, already at drop depth)</p>

    <div class="field">
      <label for="dropPositionX">Drop position (m)</label>
      <input type="range" id="dropPositionX" min="0" max="2000" step="0.5" />
      <span id="dropPositionXValue" class="value"></span>
    </div>

    <div class="field">
      <label for="dropWidth">Drop width (m)</label>
      <input type="range" id="dropWidth" min="0.1" max="2000" step="0.1" />
      <span id="dropWidthValue" class="value"></span>
    </div>

    <div class="field">
      <label for="dropAreaM2">Drop area (m^2)</label>
      <input type="range" id="dropAreaM2" min="0" max="5000" step="0.1" />
      <span id="dropAreaM2Value" class="value"></span>
    </div>
    <p id="dropDepthInfo" class="info"></p>

    <hr />

    <div class="field">
      <label for="maxHeightDisplay">Display max height (m)</label>
      <input type="range" id="maxHeightDisplay" min="1" max="500" step="0.5" />
      <span id="maxHeightDisplayValue" class="value"></span>
    </div>

    <div class="field checkbox-field">
      <label for="showOutline">Show column outlines</label>
      <input type="checkbox" id="showOutline" />
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
